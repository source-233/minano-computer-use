[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "minano-computer-use"
version = "0.5.4"
description = "Windows MCP with strict UI Automation, explicit native input, and verifiable results"
requires-python = ">=3.13,<3.14"
license = "MIT AND PSF-2.0"
license-files = ["LICENSE", "third_party/CPython-LICENSE.txt", "third_party/NOTICE.md"]
dependencies = [
  "av==19.0.2",
  "mcp>=1.30,<2",
  "uiautomation>=2.0.29,<3; sys_platform == 'win32'",
  "mss>=10,<11",
  "pillow>=11,<13",
]

[project.scripts]
minano-computer-use = "minano_computer_use.server:main"

[project.optional-dependencies]
wgc = ["windows-capture==2.0.1; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/minano_computer_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: real Windows UI Automation against an owned fixture"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
